[package]
name = "p2p"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
primitives = { package = 'primitives', path = '../primitives', default-features = false }
system = { package = 'system', path = '../system', default-features = false }

libp2p = { version = "0.53.2", features = ["ping", "macros", "tcp", "dns", "tokio", "websocket", "noise", "yamux", "kad", "identify", "gossipsub", "mdns", "quic"]}
libp2p-gossipsub = { version = "0.46.1" }
tokio = { version = "1.34.0", features = ["full"] }
tokio-stream = "0.1.14"
serde = {version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
pretty_env_logger = "0.5.0"
enum-as-inner = "=0.5.1" # temporary fix for error[E0592]: duplicate definitions with name `is_soa` https://github.com/bluejekyll/trust-dns/issues/1946
aes-gcm = "0.10.3" # Makes a dependency error dissapear
either = "1.8"
multiaddr = { version = "0.18.1" }
void = "1.0.2"
anyhow = "1.0.71"
async-trait = "0.1.68"
log = "0.4.18"
itertools = "0.12.0"
bincode="1.3.3"
tracing = "0.1.40"

vrf-helper = { package = 'vrf-helper', path = '../vrf-helper', default-features = false }

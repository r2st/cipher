[package]
name = "db"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
scylla = "0.11.1"
tokio = { version = "1.34.0", features = ["full"] }
byteorder = "1.4.3"
num-bigint = "0.4.3"
num-traits = "0.2.14"
anyhow = "1.0.71"
once_cell = "1.18.0"
lazy_static = "1.4.0"
log = "0.4.18"
directories = "5.0.1"
primitives = { package = 'primitives', path = '../primitives', default-features = false }
system = { package = 'system', path = '../system', default-features = false }
serial_test = "3.0.0"
dotenvy = "0.15"
chrono = "0.4.19"
diesel_migrations = "2.1.0"
diesel = { version = "2.1.3", features = [
    "postgres",
    "chrono",
    "numeric",
    "r2d2",
] }
structopt = "0.3.26"
serde = "1.0.189"
bigdecimal = "0.4.2"
rand = "0.8.5"
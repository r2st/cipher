[package]
name = "sub_cluster"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
serde_bytes = "0.11.9"
sha2 = "0.10.6"
bincode = "1.3.3"
anyhow = "1.0.71"
tempfile = "3.5.0"
scylla = "0.11.1"
tokio = { version = "1.34.0", features = ["full"] }
num-traits = "0.2.15"

primitives = { package = 'primitives', path = '../primitives', default-features = false }
db = { package = 'db', path = '../db', default-features = false }

vrf-helper = { package = 'vrf-helper', path = '../vrf-helper', default-features = false }
lazy_static = "1.4.0"
db_traits = { package = 'db_traits', path = '../db_traits', default-features = false }
async-trait = "0.1.68"
diesel = { version = "2.1.3", features = [
    "postgres",
    "chrono",
    "numeric",
    "r2d2",
] }
bigdecimal = "0.4.2"
util = { package = 'util', path = '../util', default-features = false }
system = { package = 'system', path = '../system', default-features = false }
rocksdb = "0.21.0"

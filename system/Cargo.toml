[package]
name = "system"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
serde_bytes = "0.11.9"
sha2 = "0.10.6"
anyhow = "1.0.71"
async-trait = "0.1.68"
libp2p-gossipsub = "0.46.1"
bincode = "1.3.3"
log = "0.4.18"
thiserror = "1.0.44"
tonic = "0.10.2"
jsonrpsee = { version = "0.21.0", features = [
    "server",
    "ws-client",
    "macros",
    "client-ws-transport-native-tls",
] }


sha3 = "0.10.8"
ethers = "2.0.8"
hex-literal = "0.4.1"
k256 = "0.13.1"
secp256k1 = { version = "0.27.0", features = [ "global-context", "rand-std", "bitcoin-hashes-std"] }
hex = "0.4.3"
vrf-helper = { package = 'vrf-helper', path = '../vrf-helper', default-features = false }
primitive-types = { version = "0.12", default-features = false }
primitives = { package = 'primitives', path = '../primitives', default-features = false }
evm-runtime = "0.41.0"
rlp = { version = "0.5", default-features = false }
tokio = "1.32.0"
toml = "0.8.1"
regex = { version = "1.10.2", features = [] }
ethereum = { version = "0.15.0", default-features = false, features = [
    "with-serde",
] }
